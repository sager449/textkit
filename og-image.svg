<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1e2e"/>
      <stop offset="100%" stop-color="#1a2a3f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo mark -->
  <rect x="60" y="60" width="80" height="80" rx="12" fill="#000"/>
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#fff" text-anchor="middle">T</text>

  <!-- Brand name -->
  <text x="160" y="115" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Text<tspan fill="#3b82f6">Kit</tspan></text>

  <!-- Main title -->
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Text tools that</text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#3b82f6">just work.</text>

  <!-- Subtitle -->
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#94a3b4">34 free text tools — for English and Arabic.</text>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#94a3b4">No signup. No upload. No waiting.</text>

  <!-- URL -->
  <text x="1140" y="580" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3b82f6" text-anchor="end">textkit-xi.vercel.app</text>
</svg>
