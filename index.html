    <title>TextKit — Free Online Text Tools</title>

<meta name="theme-color" content="#000000">

<meta property="og:image" content="https://textkit-xi.vercel.app/og-image.svg">

<!-- Twitter -->

<meta name="twitter:image" content="https://textkit-xi.vercel.app/og-image.svg">

    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2ZRPMBL8SQ');

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="TextKit home">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <button class="settings-btn" id="settings-btn" aria-label="Settings">⚙️</button>
    </header>

    <main>
      <section class="hero section-shell">
        <p class="eyebrow">
          <span class="eyebrow-dot"></span> Free · Fast · No signup
        </p>
        <h1>Text tools that<br /><span>just work.</span></h1>
        <p class="hero-lede">
          Clean, format, and analyze your text instantly — in English and Arabic.
          No account, no upload, no waiting.
        </p>
      </section>

      <section class="tools-section section-shell">
        <h2 class="section-title">All Tools</h2>
        <div class="tools-grid" id="tools-grid"></div>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <a class="brand" href="/">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <p>© 2026 TextKit — All tools are free</p>
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Privacy</a>
      </div>
    </footer>

    <!-- ===== Settings Modal ===== -->
    <div class="settings-modal" id="settings-modal" hidden>
      <div class="modal-backdrop" data-close-settings></div>
      <div class="settings-panel">
        <button class="modal-close" type="button" data-close-settings>×</button>
        <h3 class="settings-title">Settings</h3>
        <p class="settings-label">Theme</p>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="light">
            <span class="theme-dot theme-light"></span> Light
          </button>
          <button class="theme-btn" data-theme="dark">
            <span class="theme-dot theme-dark"></span> Dark
          </button>
        </div>
      </div>
    </div>

    <script>
      /* ===== Tools Data ===== */
      const TOOLS = [
        { id: "remove-spaces", icon: "⎵", name: "Remove Spaces", desc: "Remove extra spaces from your text." },
        { id: "remove-line-breaks", icon: "¶", name: "Remove Line Breaks", desc: "Combine lines into a single paragraph." },
        { id: "word-counter", icon: "#", name: "Word Counter", desc: "Count words, characters, and sentences." },
        { id: "case-converter", icon: "Aa", name: "Case Converter", desc: "UPPER, lower, Title Case, and more." },
        { id: "remove-diacritics", icon: "َ", name: "Remove Diacritics", desc: "Remove Arabic diacritics (tashkeel)." },
        { id: "remove-punctuation", icon: "!", name: "Remove Punctuation", desc: "Remove all punctuation marks." },
        { id: "remove-duplicates", icon: "≡", name: "Remove Duplicate Lines", desc: "Remove duplicate lines from a list." },
        { id: "sort-lines", icon: "↕", name: "Sort Lines", desc: "Sort lines alphabetically A-Z or Z-A." },
        { id: "text-to-slug", icon: "/", name: "Text to Slug", desc: "Convert text to a URL-friendly slug." },
        { id: "character-counter", icon: "©", name: "Character Counter", desc: "Count letters, numbers, and symbols." },
        { id: "find-and-replace", icon: "⌕", name: "Find and Replace", desc: "Replace text instantly." },
        { id: "extract-emails", icon: "@", name: "Extract Emails", desc: "Find all emails in your text." },
        { id: "extract-urls", icon: "🔗", name: "Extract URLs", desc: "Find all URLs in your text." },
        { id: "text-repeater", icon: "×", name: "Text Repeater", desc: "Repeat text multiple times." },
        { id: "add-line-numbers", icon: "1.", name: "Add Line Numbers", desc: "Add numbers to each line." },
        { id: "remove-numbers", icon: "0", name: "Remove Numbers", desc: "Remove all digits from text." },
        { id: "remove-html-tags", icon: "<>", name: "Remove HTML Tags", desc: "Strip all HTML tags." },
        { id: "trim-text", icon: "⌐", name: "Trim Text", desc: "Remove whitespace from edges." },
        { id: "lorem-ipsum", icon: "L", name: "Lorem Ipsum", desc: "Generate placeholder text." },
        { id: "base64", icon: "64", name: "Base64 Encode/Decode", desc: "Convert to/from Base64." },
        { id: "url-encode", icon: "%", name: "URL Encode/Decode", desc: "Encode or decode URLs." },
        { id: "json-formatter", icon: "{}", name: "JSON Formatter", desc: "Format and validate JSON." },
        { id: "html-escape", icon: "&", name: "HTML Escape", desc: "Escape or unescape HTML." },
        { id: "remove-emoji", icon: "☺", name: "Remove Emojis", desc: "Remove all emojis from text." },
        { id: "reverse-words", icon: "⇋", name: "Reverse Word Order", desc: "Reverse word order (not letters)." },
        { id: "sentence-counter", icon: "…", name: "Sentence Counter", desc: "Count sentences in your text." },
        { id: "paragraph-counter", icon: "¶¶", name: "Paragraph Counter", desc: "Count paragraphs in your text." },
        { id: "reading-time", icon: "⏱", name: "Reading Time", desc: "Calculate reading time." },
        { id: "extract-numbers", icon: "№", name: "Extract Numbers", desc: "Extract all numbers from text." },
        { id: "extract-hashtags", icon: "＃", name: "Extract Hashtags", desc: "Extract all hashtags from text." },
        { id: "arabic-numbers", icon: "١٢", name: "Arabic Numbers", desc: "Convert Arabic ↔ English numbers." },
        { id: "remove-duplicate-words", icon: "⊘", name: "Remove Duplicate Words", desc: "Remove repeated words." },
        { id: "sort-words", icon: "⇅", name: "Sort Words", desc: "Sort words alphabetically." },
        { id: "remove-english-diacritics", icon: "é", name: "Remove Latin Diacritics", desc: "café → cafe." }
      ];

      const THEME_KEY = "textkit-theme";

      /* ===== Render Tools ===== */
      const toolsGrid = document.getElementById("tools-grid");

      function renderTools() {
        toolsGrid.innerHTML = TOOLS.map((tool, index) => `
          <a class="tool-card" href="tools/${tool.id}.html">
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-info">
              <h3>${index + 1}. ${tool.name}</h3>
              <p>${tool.desc}</p>
            </div>
            <span class="tool-arrow">→</span>
          </a>
        `).join("");
      }

      /* ===== Settings ===== */
      const settingsModal = document.getElementById("settings-modal");
      const settingsBtn = document.getElementById("settings-btn");

      settingsBtn.addEventListener("click", () => {
        settingsModal.hidden = false;
      });

      settingsModal.querySelectorAll("[data-close-settings]").forEach((el) => {
        el.addEventListener("click", () => {
          settingsModal.hidden = true;
        });
      });

      /* ===== Theme ===== */
      document.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const theme = btn.dataset.theme;
          localStorage.setItem(THEME_KEY, theme);
          document.body.classList.toggle("dark-mode", theme === "dark");
          document.querySelectorAll(".theme-btn").forEach((b) =>
            b.classList.remove("active")
          );
          btn.classList.add("active");
        });
      });

      const savedTheme = localStorage.getItem(THEME_KEY) || "light";
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        document.querySelector(".theme-btn[data-theme='dark']")?.classList.add("active");
        document.querySelector(".theme-btn[data-theme='light']")?.classList.remove("active");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") settingsModal.hidden = true;
      });

      /* ===== Init ===== */
      renderTools();
    </script>
  </body>
          </html>
