<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert Arabic numbers (٠-٩) to English (0-9) and vice versa. Free online tool." />
    <title>Arabic Numbers Converter — TextKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/tool.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <button class="settings-btn" id="settings-btn">⚙️</button>
    </header>

    <main>
      <div class="tool-container">
        <a class="back-link" href="../index.html">← All tools</a>

        <div class="tool-header">
          <h1>Arabic <span>Numbers</span></h1>
          <p>Convert Arabic numbers (٠١٢٣٤٥٦٧٨٩) to English (0123456789) and vice versa.</p>
        </div>

        <div class="tool-panel">
          <textarea class="tool-textarea" id="input" placeholder="Type or paste your text with numbers here..."></textarea>

          <div class="tool-actions">
            <button class="btn btn-primary" onclick="toEnglish()">Arabic → English</button>
            <button class="btn btn-primary" onclick="toArabic()">English → Arabic</button>
          </div>

          <div class="tool-actions">
            <button class="btn btn-secondary" onclick="copyOutput()">
              Copy <span class="copy-feedback" id="copy-feedback">✓ Copied</span>
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
          </div>

          <div class="tool-stats">
            <div class="stat-box"><strong id="stat-words">0</strong><span>Words</span></div>
            <div class="stat-box"><strong id="stat-chars">0</strong><span>Characters</span></div>
            <div class="stat-box"><strong id="stat-chars-ns">0</strong><span>No Spaces</span></div>
            <div class="stat-box"><strong id="stat-lines">0</strong><span>Lines</span></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer section-shell">
      <a class="brand" href="../index.html">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <p>© 2026 TextKit</p>
    </footer>

    <div class="settings-modal" id="settings-modal" hidden>
      <div class="modal-backdrop" data-close-settings></div>
      <div class="settings-panel">
        <button class="modal-close" type="button" data-close-settings>×</button>
        <h3 class="settings-title">Settings</h3>
        <p class="settings-label">Theme</p>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="light"><span class="theme-dot theme-light"></span> Light</button>
          <button class="theme-btn" data-theme="dark"><span class="theme-dot theme-dark"></span> Dark</button>
        </div>
      </div>
    </div>

    <script src="../js/tools.js"></script>
    <script>
      const ARABIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";
      const ENGLISH_DIGITS = "0123456789";

      function toEnglish() {
        const text = getInput();
        const result = text.replace(/[٠-٩]/g, (d) => ENGLISH_DIGITS[ARABIC_DIGITS.indexOf(d)]);
        setOutput(result);
        updateStats();
      }

      function toArabic() {
        const text = getInput();
        const result = text.replace(/[0-9]/g, (d) => ARABIC_DIGITS[ENGLISH_DIGITS.indexOf(d)]);
        setOutput(result);
        updateStats();
      }

      const settingsModal = document.getElementById("settings-modal");
      const settingsBtn = document.getElementById("settings-btn");
      const THEME_KEY = "textkit-theme";

      settingsBtn.addEventListener("click", () => settingsModal.hidden = false);
      settingsModal.querySelectorAll("[data-close-settings]").forEach((el) => {
        el.addEventListener("click", () => settingsModal.hidden = true);
      });
      document.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const theme = btn.dataset.theme;
          localStorage.setItem(THEME_KEY, theme);
          document.body.classList.toggle("dark-mode", theme === "dark");
          document.querySelectorAll(".theme-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
      const savedTheme = localStorage.getItem(THEME_KEY) || "light";
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        document.querySelector(".theme-btn[data-theme='dark']")?.classList.add("active");
        document.querySelector(".theme-btn[data-theme='light']")?.classList.remove("active");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") settingsModal.hidden = true;
      });
    </script>
  </body>
</html>
