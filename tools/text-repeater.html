<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Repeat any text multiple times instantly. Free online tool." />
    <title>Text Repeater — TextKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/tool.css" />
    <style>
      .repeat-row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .repeat-row label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .repeat-row input[type="number"] {
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        background: var(--cream);
        color: var(--ink);
        outline: none;
        width: 100px;
      }
      .repeat-row input[type="number"]:focus { border-color: var(--accent); }
      .repeat-row input[type="text"] {
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        background: var(--cream);
        color: var(--ink);
        outline: none;
        flex: 1;
        min-width: 150px;
      }
      body.dark-mode .repeat-row input { background: #0d1420; color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <button class="settings-btn" id="settings-btn">⚙️</button>
    </header>

    <main>
      <div class="tool-container">
        <a class="back-link" href="../index.html">← All tools</a>

        <div class="tool-header">
          <h1>Text <span>Repeater</span></h1>
          <p>Repeat your text multiple times with a custom separator.</p>
        </div>

        <div class="tool-panel">
          <div class="repeat-row">
            <label>Times:</label>
            <input type="number" id="repeat-count" value="3" min="1" max="1000" />
            <label>Separator:</label>
            <input type="text" id="repeat-separator" value=" " placeholder="Space" />
          </div>

          <textarea class="tool-textarea" id="input" placeholder="Type or paste your text here..."></textarea>

          <div class="tool-actions">
            <button class="btn btn-primary" onclick="repeatText()">Repeat Text</button>
            <button class="btn btn-secondary" onclick="copyOutput()">
              Copy <span class="copy-feedback" id="copy-feedback">✓ Copied</span>
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer section-shell">
      <a class="brand" href="../index.html">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <p>© 2026 TextKit</p>
    </footer>

    <div class="settings-modal" id="settings-modal" hidden>
      <div class="modal-backdrop" data-close-settings></div>
      <div class="settings-panel">
        <button class="modal-close" type="button" data-close-settings>×</button>
        <h3 class="settings-title">Settings</h3>
        <p class="settings-label">Theme</p>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="light"><span class="theme-dot theme-light"></span> Light</button>
          <button class="theme-btn" data-theme="dark"><span class="theme-dot theme-dark"></span> Dark</button>
        </div>
      </div>
    </div>

    <script src="../js/tools.js"></script>
    <script>
      function repeatText() {
        const text = getInput();
        const count = Math.min(Math.max(parseInt(document.getElementById("repeat-count").value) || 1, 1), 1000);
        const sep = document.getElementById("repeat-separator").value;
        const result = Array(count).fill(text).join(sep);
        setOutput(result);
      }

      const settingsModal = document.getElementById("settings-modal");
      const settingsBtn = document.getElementById("settings-btn");
      const THEME_KEY = "textkit-theme";

      settingsBtn.addEventListener("click", () => settingsModal.hidden = false);
      settingsModal.querySelectorAll("[data-close-settings]").forEach((el) => {
        el.addEventListener("click", () => settingsModal.hidden = true);
      });
      document.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const theme = btn.dataset.theme;
          localStorage.setItem(THEME_KEY, theme);
          document.body.classList.toggle("dark-mode", theme === "dark");
          document.querySelectorAll(".theme-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
      const savedTheme = localStorage.getItem(THEME_KEY) || "light";
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        document.querySelector(".theme-btn[data-theme='dark']")?.classList.add("active");
        document.querySelector(".theme-btn[data-theme='light']")?.classList.remove("active");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") settingsModal.hidden = true;
      });
    </script>
  </body>
        </html>
