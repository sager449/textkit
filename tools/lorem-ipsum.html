<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate Lorem Ipsum placeholder text. Free online tool." />
    <title>Lorem Ipsum Generator — TextKit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/tool.css" />
    <style>
      .lorem-controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .lorem-controls label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .lorem-controls input[type="number"] {
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        background: var(--cream);
        color: var(--ink);
        outline: none;
        width: 100px;
      }
      .lorem-controls select {
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        background: var(--cream);
        color: var(--ink);
        outline: none;
      }
      body.dark-mode .lorem-controls input,
      body.dark-mode .lorem-controls select { background: #0d1420; color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="../index.html">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <button class="settings-btn" id="settings-btn">⚙️</button>
    </header>

    <main>
      <div class="tool-container">
        <a class="back-link" href="../index.html">← All tools</a>

        <div class="tool-header">
          <h1>Lorem <span>Ipsum</span></h1>
          <p>Generate placeholder text for your designs and mockups.</p>
        </div>

        <div class="tool-panel">
          <div class="lorem-controls">
            <label>Type:</label>
            <select id="lorem-type">
              <option value="paragraphs">Paragraphs</option>
              <option value="sentences">Sentences</option>
              <option value="words">Words</option>
            </select>
            <label>Count:</label>
            <input type="number" id="lorem-count" value="3" min="1" max="50" />
          </div>

          <textarea class="tool-textarea" id="input" placeholder="Click Generate to create text..."></textarea>

          <div class="tool-actions">
            <button class="btn btn-primary" onclick="generateLorem()">Generate</button>
            <button class="btn btn-secondary" onclick="copyOutput()">
              Copy <span class="copy-feedback" id="copy-feedback">✓ Copied</span>
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer section-shell">
      <a class="brand" href="../index.html">
        <span class="brand-mark">T</span>
        <span class="brand-name">Text<em>Kit</em></span>
      </a>
      <p>© 2026 TextKit</p>
    </footer>

    <div class="settings-modal" id="settings-modal" hidden>
      <div class="modal-backdrop" data-close-settings></div>
      <div class="settings-panel">
        <button class="modal-close" type="button" data-close-settings>×</button>
        <h3 class="settings-title">Settings</h3>
        <p class="settings-label">Theme</p>
        <div class="theme-options">
          <button class="theme-btn active" data-theme="light"><span class="theme-dot theme-light"></span> Light</button>
          <button class="theme-btn" data-theme="dark"><span class="theme-dot theme-dark"></span> Dark</button>
        </div>
      </div>
    </div>

    <script src="../js/tools.js"></script>
    <script>
      const LOREM_WORDS = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum".split(" ");

      function randomSentence() {
        const len = 8 + Math.floor(Math.random() * 10);
        const words = [];
        for (let i = 0; i < len; i++) {
          words.push(LOREM_WORDS[Math.floor(Math.random() * LOREM_WORDS.length)]);
        }
        const sentence = words.join(" ");
        return sentence.charAt(0).toUpperCase() + sentence.slice(1) + ".";
      }

      function randomParagraph() {
        const count = 4 + Math.floor(Math.random() * 3);
        return Array(count).fill(0).map(randomSentence).join(" ");
      }

      function generateLorem() {
        const type = document.getElementById("lorem-type").value;
        const count = Math.min(Math.max(parseInt(document.getElementById("lorem-count").value) || 1, 1), 50);
        let result = "";

        if (type === "paragraphs") {
          result = Array(count).fill(0).map(randomParagraph).join("\n\n");
        } else if (type === "sentences") {
          result = Array(count).fill(0).map(randomSentence).join(" ");
        } else {
          const words = [];
          for (let i = 0; i < count; i++) {
            words.push(LOREM_WORDS[Math.floor(Math.random() * LOREM_WORDS.length)]);
          }
          result = words.join(" ");
        }
        setOutput(result);
      }

      const settingsModal = document.getElementById("settings-modal");
      const settingsBtn = document.getElementById("settings-btn");
      const THEME_KEY = "textkit-theme";

      settingsBtn.addEventListener("click", () => settingsModal.hidden = false);
      settingsModal.querySelectorAll("[data-close-settings]").forEach((el) => {
        el.addEventListener("click", () => settingsModal.hidden = true);
      });
      document.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const theme = btn.dataset.theme;
          localStorage.setItem(THEME_KEY, theme);
          document.body.classList.toggle("dark-mode", theme === "dark");
          document.querySelectorAll(".theme-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
      const savedTheme = localStorage.getItem(THEME_KEY) || "light";
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        document.querySelector(".theme-btn[data-theme='dark']")?.classList.add("active");
        document.querySelector(".theme-btn[data-theme='light']")?.classList.remove("active");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") settingsModal.hidden = true;
      });
    </script>
  </body>
</html>
